services:
  - type: web
    name: stock-portfolio-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --timeout 180 --preload --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BACKGROUND_PRICE_REFRESH
        value: "1"
      - key: BACKGROUND_REFRESH_INTERVAL_SEC
        value: "60"
      - key: TRACKED_TICKERS_TTL_SEC
        value: "300"
