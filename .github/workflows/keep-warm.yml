name: keep-render-warm

# Render Free は 15 分間アクセスが無いとスリープし、次回起動に 30〜60 秒かかる。
# /api/health を定期的に叩いて起こしておくことで、初回の株価取得を即応答にする。
# Public リポジトリのため GitHub Actions は無料・無制限。

on:
  schedule:
    # 10 分ごと（GitHub cron は UTC）。
    # JST 07:00〜24:00 のみ稼働 = UTC 22:00〜14:59 → hours 0-14,22,23。
    # 稼働時間を絞り Render Free の instance-hours を節約する。
    - cron: '*/10 0-14,22,23 * * *'
  workflow_dispatch: {}   # 手動実行も可能

# 遅延で実行が重なっても 1 本に集約
concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          # 別 URL に切り替えたい場合はリポジトリ変数 RENDER_HEALTH_URL を設定
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://stock-portfolio-1-2rnh.onrender.com/api/health' }}
        run: |
          echo "Pinging $HEALTH_URL"
          # スリープからの起動は最大 60 秒かかるため、間隔を空けて最大 3 回試行
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$HEALTH_URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Render is awake."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::health check did not return 200 after 3 attempts"
          exit 1
